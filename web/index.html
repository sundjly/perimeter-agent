<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Perimeter Agent</title>
		<link rel="stylesheet" href="/app.css" />
	</head>
	<body>
		<header>
			<div class="brand">
				<span class="dot" id="conn-dot"></span>
				<strong>Perimeter Agent</strong>
				<span class="muted" id="model">—</span>
			</div>
			<div class="muted" id="usage">token 0</div>
		</header>

		<main>
			<section class="pane" id="conversation-pane">
				<h2>对话</h2>
				<div id="stream" class="scroll"></div>
				<form id="composer">
					<textarea id="input" rows="3" placeholder="描述要做的事，例如：修复登录超时的 bug"></textarea>
					<div class="row">
						<button type="submit" id="send">发送</button>
						<button type="button" id="steer" class="ghost">插话</button>
						<button type="button" id="abort" class="ghost">中止</button>
					</div>
				</form>
			</section>

			<details class="pane" id="audit-pane" open>
				<summary>审计日志 <span class="muted" id="audit-count">0 条</span></summary>
				<div id="audit" class="scroll mono"></div>
			</details>
		</main>

		<script type="module" src="/app.js"></script>
	</body>
</html>
