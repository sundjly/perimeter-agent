# 每会话独占的沙箱 Pod。网关按此模板创建，会话结束即销毁。
#
# 三条与安全模型直接对应的设置，改动前请先读 §4.5/§4.6：
# 1. runtimeClassName: gvisor —— 内核级隔离，且不需要嵌套虚拟化
#    （Firecracker 冷启更快，但很多客户的云环境不支持嵌套虚拟化，
#     所以它不是默认选项）
# 2. 没有任何 secret 挂载、没有 serviceAccount token —— 铁律 2：
#    凭据永不进沙箱。git 走凭据代理，模型 key 只在模型网关
# 3. 只读根文件系统 + 非 root + 丢弃全部 capability
apiVersion: v1
kind: Pod
metadata:
  name: perimeter-sandbox-SESSION_ID
  labels:
    app.kubernetes.io/name: perimeter-sandbox
    perimeter.dev/session: SESSION_ID
spec:
  runtimeClassName: gvisor
  # 不给 Pod 挂 SA token：沙箱没有任何理由访问 K8s API
  automountServiceAccountToken: false
  restartPolicy: Never
  # 会话空闲回收由网关负责；这里兜一个硬上限，防止 Pod 泄漏
  activeDeadlineSeconds: 14400
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      # 客户自带构建镜像：环境保真度是选云沙箱而非浏览器内执行的首要理由
      image: CUSTOMER_BUILD_IMAGE
      imagePullPolicy: IfNotPresent
      # **不能把 pi 作为主进程**：Pod 的 stdin 立即 EOF，pi 随即退出，
      # restartPolicy: Never 让 Pod 进入 Completed，之后 KubectlBackend 的
      # `kubectl exec` 就无处可 exec 了。主进程只负责让 Pod 活着，
      # pi 由网关经 exec 拉起（每个会话一次）。
      command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
      workingDir: /workspace
      env:
        # 只有策略文件路径走 env。模型网关地址、git 代理地址与代理 token
        # **不在这里** —— 它们由网关的 sandbox-config.ts 生成成
        # $HOME/.pi/agent/models.json 与 $HOME/.gitconfig，经 sandbox-home
        # 卷送进来。走文件而不是 env 是有意的：env 会出现在 `kubectl describe`
        # 与容器的 /proc/1/environ 里。
        - name: PERIMETER_POLICY_FILE
          value: /etc/perimeter/policy.yaml
        - name: PERIMETER_REPO
          value: REPO_NAME
        - name: PERIMETER_TEAM
          value: TEAM_NAME
        - name: HOME
          value: /home/agent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: tmp
          mountPath: /tmp
        - name: policy
          mountPath: /etc/perimeter
          readOnly: true
        # 策略扩展跑在 pi 进程内。没有这一份，K8s 形态下就没有 tool_call
        # 钩子 —— 钩子级拦截是产品的核心卖点，缺了它审计与审批门全部落空。
        # 内容与 docker 后端只读挂载的三个子树等价，随镜像一起构建更稳妥
        # （node_modules 有平台相关性，不要从宿主机挂）。
        - name: perimeter-runtime
          mountPath: /opt/perimeter
          readOnly: true
        # 沙箱 HOME：models.json 与 .gitconfig 由网关写入后挂进来
        - name: sandbox-home
          mountPath: /home/agent
  volumes:
    # 工作区不共享：横向移动的前提之一就是共享卷
    - name: workspace
      emptyDir:
        sizeLimit: 10Gi
    - name: tmp
      emptyDir:
        sizeLimit: 2Gi
    - name: policy
      configMap:
        name: perimeter-policy
    # 与 docker 后端的三个只读挂载等价。用 image 里自带的一份更稳妥：
    # node_modules 是平台相关的，从宿主机挂会在 ABI 上出问题。
    - name: perimeter-runtime
      configMap:
        name: perimeter-runtime
    - name: sandbox-home
      emptyDir:
        sizeLimit: 64Mi
