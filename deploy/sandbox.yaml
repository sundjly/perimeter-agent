# 每会话独占的沙箱 Pod。网关按此模板创建，会话结束即销毁。
#
# 三条与安全模型直接对应的设置，改动前请先读 §4.5/§4.6：
# 1. runtimeClassName: gvisor —— 内核级隔离，且不需要嵌套虚拟化
#    （Firecracker 冷启更快，但很多客户的云环境不支持嵌套虚拟化，
#     所以它不是默认选项）
# 2. 没有任何 secret 挂载、没有 serviceAccount token —— 铁律 2：
#    凭据永不进沙箱。git 走凭据代理，模型 key 只在模型网关
# 3. 只读根文件系统 + 非 root + 丢弃全部 capability
apiVersion: v1
kind: Pod
metadata:
  name: perimeter-sandbox-SESSION_ID
  labels:
    app.kubernetes.io/name: perimeter-sandbox
    perimeter.dev/session: SESSION_ID
spec:
  runtimeClassName: gvisor
  # 不给 Pod 挂 SA token：沙箱没有任何理由访问 K8s API
  automountServiceAccountToken: false
  restartPolicy: Never
  # 会话空闲回收由网关负责；这里兜一个硬上限，防止 Pod 泄漏
  activeDeadlineSeconds: 14400
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      # 客户自带构建镜像：环境保真度是选云沙箱而非浏览器内执行的首要理由
      # ⚠️ 镜像里**必须有 tar**：网关用 `kubectl cp` 把会话配置送进 Pod，
      # 而 kubectl cp 走的是 exec+tar。distroless 镜像会让整条会话路径断在
      # 这里，且错误信息离原因很远。这一条要进部署前置条件清单。
      image: CUSTOMER_BUILD_IMAGE
      imagePullPolicy: IfNotPresent
      # **不能把 pi-env serve 作为主进程**：Pod 的 stdin 立即 EOF，daemon 随即退出，
      # restartPolicy: Never 让 Pod 进入 Completed，之后 KubectlBackend 的
      # `kubectl exec` 就无处可 exec 了。主进程只负责让 Pod 活着，
      # pi-env 由网关经 exec -i 拉起（每个会话一次）。
      command: ["sh", "-c", "trap : TERM INT; sleep infinity & wait"]
      workingDir: /workspace
      env:
        # 会话级 git 配置（.gitconfig）不走 env，也不走 Secret 卷：
        # 网关在 Pod Ready 之后用 `kubectl cp` 写进下面的 sandbox-home
        # （见 KubectlBackend.prepare）。选 cp 而不是 Secret 的理由：Secret 要
        # 按会话建、按会话回收，多一套生命周期；而且它会在 K8s API 里留一份
        # 副本，而 cp 进 emptyDir 的东西只在 Pod 内。两者对沙箱都是可读的 ——
        # 里面本来就是给沙箱用的代理 token，不是上游凭据。
        #
        # ⚠️ 整条 kubectl 路径**未在真实集群验证过**，只验证了命令行形状。
        - name: PERIMETER_POLICY_FILE
          value: /etc/perimeter/policy.yaml
        - name: PERIMETER_REPO
          value: REPO_NAME
        - name: PERIMETER_TEAM
          value: TEAM_NAME
        - name: HOME
          value: /home/agent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        # ── S2 Phase B：受保护路径 RO subPath 挂载（与 config/policy.yaml deny_paths
        # 派生清单同源，见 src/gateway/protected-mounts.ts；tests/protected-paths-docker.test.ts
        # 钉死两者一致）────────────────────────────
        # 语义：同一 workspace emptyDir 的子路径以只读再挂载，容器内 bash/python 写这些
        # 路径（新建/覆盖/rm/mv/chmod）被内核拒绝（EROFS），与 docker 后端的 RO bind 对齐。
        # ⚠️ 部署前置（与 docker 侧流形门控同源）：
        # 1. 这些路径必须在容器启动前存在于 emptyDir 中（目录由平台预创建；文件型条目
        #    需预置空文件或实际文件）—— kubelet 对缺失 subPath 的自动创建行为与
        #    文件型 subPath 的挂载语义未在真实集群验证；
        # 2. 会话内 git clone（repoUrl 流形）要求空目录 —— clone 型会话必须整组关掉
        #    这些挂载（与 docker 侧 ctx.repoUrl 门控同源），否则 clone fatal。
        # ⚠️ external_blocked：kubectl 未配置，本组挂载未在真实集群 apply/验证过，
        # 只完成了生成物与本文件的单测（tests/protected-paths-docker.test.ts）。
        - name: workspace
          mountPath: /workspace/.aws
          subPath: .aws
          readOnly: true
        - name: workspace
          mountPath: /workspace/.buildkite
          subPath: .buildkite
          readOnly: true
        - name: workspace
          mountPath: /workspace/.clinerules
          subPath: .clinerules
          readOnly: true
        - name: workspace
          mountPath: /workspace/.circleci
          subPath: .circleci
          readOnly: true
        - name: workspace
          mountPath: /workspace/.cursorrules
          subPath: .cursorrules
          readOnly: true
        - name: workspace
          mountPath: /workspace/.env
          subPath: .env
          readOnly: true
        - name: workspace
          mountPath: /workspace/.git/config
          subPath: .git/config
          readOnly: true
        - name: workspace
          mountPath: /workspace/.git/hooks
          subPath: .git/hooks
          readOnly: true
        - name: workspace
          mountPath: /workspace/.gitconfig
          subPath: .gitconfig
          readOnly: true
        - name: workspace
          mountPath: /workspace/.github/workflows
          subPath: .github/workflows
          readOnly: true
        - name: workspace
          mountPath: /workspace/.gitlab-ci.yml
          subPath: .gitlab-ci.yml
          readOnly: true
        - name: workspace
          mountPath: /workspace/.npmrc
          subPath: .npmrc
          readOnly: true
        - name: workspace
          mountPath: /workspace/.pi
          subPath: .pi
          readOnly: true
        - name: workspace
          mountPath: /workspace/.ssh
          subPath: .ssh
          readOnly: true
        - name: workspace
          mountPath: /workspace/AGENTS.md
          subPath: AGENTS.md
          readOnly: true
        - name: workspace
          mountPath: /workspace/AGENTS.override.md
          subPath: AGENTS.override.md
          readOnly: true
        - name: workspace
          mountPath: /workspace/CLAUDE.md
          subPath: CLAUDE.md
          readOnly: true
        - name: workspace
          mountPath: /workspace/Dockerfile
          subPath: Dockerfile
          readOnly: true
        - name: workspace
          mountPath: /workspace/Jenkinsfile
          subPath: Jenkinsfile
          readOnly: true
        - name: workspace
          mountPath: /workspace/azure-pipelines.yml
          subPath: azure-pipelines.yml
          readOnly: true
        - name: workspace
          mountPath: /workspace/secrets
          subPath: secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: policy
          mountPath: /etc/perimeter
          readOnly: true
        # 沙箱 HOME。必须可写：readOnlyRootFilesystem 下 工具要写临时文件，
        # 网关也要往这里 cp 会话配置。
        # ⚠️ 策略扩展所在的 /opt/perimeter **由镜像提供**（见
        # deploy/sandbox.Dockerfile），不在这里挂 —— ConfigMap 有 1MiB 上限，
        # 而扩展的依赖有 27MB，用 configMap 会让 Pod 卡在 ContainerCreating。
        - name: sandbox-home
          mountPath: /home/agent
  volumes:
    # 工作区不共享：横向移动的前提之一就是共享卷
    - name: workspace
      emptyDir:
        sizeLimit: 10Gi
    - name: tmp
      emptyDir:
        sizeLimit: 2Gi
    - name: policy
      configMap:
        name: perimeter-policy
    - name: sandbox-home
      emptyDir:
        sizeLimit: 64Mi
